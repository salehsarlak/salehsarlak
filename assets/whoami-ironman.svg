<svg width="1160" height="340" viewBox="0 0 1160 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06142f"/>
      <stop offset="45%" stop-color="#0b2d63"/>
      <stop offset="75%" stop-color="#1456b8"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>

    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="340">
        <animate
          attributeName="width"
          values="0;1160;1160;0;0"
          keyTimes="0;0.22;0.78;0.96;1"
          dur="7s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1160" height="340" rx="16" fill="url(#bg)"/>

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="1158"
    height="338"
    rx="15"
    fill="none"
    stroke="#60a5fa"
    stroke-opacity="0.35"
    stroke-width="1.5"/>

  <!-- HUD Corner Brackets -->
  <g
    stroke="#60a5fa"
    stroke-width="2.5"
    fill="none"
    opacity="0.8"
    stroke-linecap="round">

    <path d="M22,26 L22,50 M22,26 L46,26"/>
    <path d="M1138,26 L1138,50 M1138,26 L1114,26"/>
    <path d="M22,314 L22,290 M22,314 L46,314"/>
    <path d="M1138,314 L1138,290 M1138,314 L1114,314"/>
  </g>

  <!-- Tarhfam Reactor -->
  <g transform="translate(1058,170)">

    <circle r="50" fill="#020817" opacity="0.45"/>

    <circle
      r="48"
      fill="none"
      stroke="#2563eb"
      stroke-width="2"
      opacity="0.8"/>

    <circle
      r="38"
      fill="none"
      stroke="#60a5fa"
      stroke-width="1.2"
      opacity="0.65"/>

    <!-- Tick Marks -->
    <g stroke="#60a5fa" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-48" x2="0" y2="-41"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(45)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(90)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(135)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(180)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(225)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(270)"/>
      <line x1="0" y1="-48" x2="0" y2="-41" transform="rotate(315)"/>
    </g>

    <!-- Radar Sweep -->
    <g>
      <path
        d="M0,0 L0,-48 A48,48 0 0 1 24,-41.6 Z"
        fill="url(#sweepGrad)"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </g>

    <!-- Energy Core -->
    <circle r="22" fill="url(#arcGlow)">
      <animate
        attributeName="r"
        values="18;25;18"
        dur="2.2s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;1;0.6"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle
      r="13"
      fill="#020817"
      stroke="#ffffff"
      stroke-width="1.5"/>

    <!-- T Logo -->
    <path
      d="M0,-8 L7,4 L-7,4 Z"
      fill="#60a5fa"/>

  </g>

  <!-- Terminal Content -->
  <g
    clip-path="url(#reveal)"
    font-family="'Fira Code','Cascadia Code',Consolas,Menlo,monospace">

    <!-- Command -->
    <text
      x="40"
      y="56"
      font-size="19"
      font-weight="700"
      fill="#60a5fa">
      saleh@sarlak-dev:~$ cat about_me.txt
    </text>

    <!-- Name -->
    <text x="40" y="98" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">name</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Saleh Sarlak</tspan>
    </text>

    <!-- Role -->
    <text x="40" y="126" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">role</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Web Designer &amp; WordPress Developer</tspan>
    </text>

    <!-- Based -->
    <text x="40" y="154" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">based_in</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Iran</tspan>
    </text>

    <!-- Focus -->
    <text x="40" y="182" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">focus</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>[WordPress, UI/UX, SEO, Performance, Web Development]</tspan>
    </text>

    <!-- Stack -->
    <text x="40" y="210" font-size="15" fill="#f1f5f9">
  <tspan fill="#93c5fd">stack</tspan>
  <tspan fill="#64748b">: </tspan>
  <tspan>[WordPress, PHP, React, JavaScript, MySQL]</tspan>
</text>

    <!-- Projects -->
    <text x="40" y="238" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">projects</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>[Bookivery, Maz Isfahan, Patak Shoes, Aman Med Iran]</tspan>
    </text>

    <!-- Building -->
    <text x="40" y="266" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">building</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Tarhfam — Digital Agency &amp; Web Solutions</tspan>
    </text>

    <!-- Open To -->
    <text x="40" y="294" font-size="15" fill="#f1f5f9">
      <tspan fill="#93c5fd">open_to</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Web Projects, Collaboration, Open Source</tspan>
    </text>

  </g>
</svg>
