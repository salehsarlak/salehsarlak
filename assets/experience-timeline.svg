<svg width="1160" height="260" viewBox="0 0 1160 260" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="blueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07142f"/>
      <stop offset="45%" stop-color="#102d66"/>
      <stop offset="75%" stop-color="#1747a6"/>
      <stop offset="100%" stop-color="#07142f"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="1160" height="260" rx="16" fill="url(#blueBg)"/>
  <rect width="1160" height="260" rx="16" fill="url(#blueGlow)"/>

  <rect
    x="1"
    y="1"
    width="1158"
    height="258"
    rx="15"
    fill="none"
    stroke="#60A5FA"
    stroke-opacity="0.3"
    stroke-width="1.5"
  />


  <!-- Floating particles -->

  <g fill="#60A5FA">

    <circle cx="230" cy="190" r="2.4" opacity="0">
      <animate
        attributeName="cy"
        values="190;30"
        dur="4.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.8;0"
        dur="4.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="520" cy="190" r="2" opacity="0">
      <animate
        attributeName="cy"
        values="190;20"
        dur="5.2s"
        repeatCount="indefinite"
        begin="1.1s"
      />
      <animate
        attributeName="opacity"
        values="0;0.7;0"
        dur="5.2s"
        repeatCount="indefinite"
        begin="1.1s"
      />
    </circle>

    <circle cx="810" cy="190" r="2.6" opacity="0">
      <animate
        attributeName="cy"
        values="190;25"
        dur="4.8s"
        repeatCount="indefinite"
        begin="2.3s"
      />
      <animate
        attributeName="opacity"
        values="0;0.8;0"
        dur="4.8s"
        repeatCount="indefinite"
        begin="2.3s"
      />
    </circle>

    <circle
      cx="1060"
      cy="190"
      r="2.2"
      opacity="0"
      fill="#DBEAFE"
    >
      <animate
        attributeName="cy"
        values="190;15"
        dur="4s"
        repeatCount="indefinite"
        begin="0.6s"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="4s"
        repeatCount="indefinite"
        begin="0.6s"
      />
    </circle>

  </g>


  <!-- Timeline -->

  <path
    id="timelinePath"
    d="M145,190 L1015,190"
    fill="none"
    stroke="#173d83"
    stroke-width="3"
  />

  <path
    d="M145,190 L1015,190"
    fill="none"
    stroke="#3B82F6"
    stroke-width="1.5"
    filter="url(#glow)"
    opacity="0.75"
  />


  <!-- Traveling pulse -->

  <circle r="3" fill="#BFDBFE" opacity="0.35">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      begin="-0.3s"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>

  </circle>

  <circle r="4" fill="#60A5FA" opacity="0.6">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      begin="-0.15s"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>

  </circle>

  <circle
    r="6"
    fill="#EFF6FF"
    filter="url(#glow)"
  >

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>

  </circle>


  <!-- ==================== NODE 1 ==================== -->

  <g transform="translate(145,190)">

    <line
      x1="0"
      y1="0"
      x2="0"
      y2="-64"
      stroke="#1D4ED8"
      stroke-width="2"
    />

    <circle
      r="16"
      fill="none"
      stroke="#60A5FA"
      stroke-width="1.5"
      opacity="0.65"
    />

    <circle
      r="8"
      fill="#2563EB"
    />

  </g>


  <g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle"
  >

    <rect
      x="15"
      y="24"
      width="260"
      height="70"
      rx="10"
      fill="#081a3c"
      stroke="#3B82F6"
      stroke-opacity="0.5"
    />

    <text
      x="145"
      y="52"
      font-size="16"
      font-weight="700"
      fill="#FFFFFF"
    >
      2023 · Freelance
    </text>

    <text
      x="145"
      y="81"
      font-size="13"
      fill="#93C5FD"
    >
      Web Designer &amp; WordPress Developer
    </text>

  </g>


  <!-- ==================== NODE 2 ==================== -->

  <g transform="translate(435,190)">

    <line
      x1="0"
      y1="0"
      x2="0"
      y2="-64"
      stroke="#1D4ED8"
      stroke-width="2"
    />

    <circle
      r="16"
      fill="none"
      stroke="#60A5FA"
      stroke-width="1.5"
      opacity="0.65"
    />

    <circle
      r="8"
      fill="#2563EB"
    />

  </g>


  <g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle"
  >

    <rect
      x="305"
      y="24"
      width="260"
      height="70"
      rx="10"
      fill="#081a3c"
      stroke="#3B82F6"
      stroke-opacity="0.5"
    />

    <text
      x="435"
      y="52"
      font-size="16"
      font-weight="700"
      fill="#FFFFFF"
    >
      2024 · Web Development
    </text>

    <text
      x="435"
      y="81"
      font-size="13"
      fill="#93C5FD"
    >
      WordPress · Elementor · WooCommerce
    </text>

  </g>


  <!-- ==================== NODE 3 ==================== -->

  <g transform="translate(725,190)">

    <line
      x1="0"
      y1="0"
      x2="0"
      y2="-64"
      stroke="#1D4ED8"
      stroke-width="2"
    />

    <circle
      r="16"
      fill="none"
      stroke="#60A5FA"
      stroke-width="1.5"
      opacity="0.65"
    />

    <circle
      r="8"
      fill="#2563EB"
    />

  </g>


  <g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle"
  >

    <rect
      x="595"
      y="24"
      width="260"
      height="70"
      rx="10"
      fill="#081a3c"
      stroke="#3B82F6"
      stroke-opacity="0.5"
    />

    <text
      x="725"
      y="52"
      font-size="16"
      font-weight="700"
      fill="#FFFFFF"
    >
      2025 · Tarhfam
    </text>

    <text
      x="725"
      y="81"
      font-size="13"
      fill="#93C5FD"
    >
      Digital Agency &amp; Web Development
    </text>

  </g>


  <!-- ==================== NODE 4 ==================== -->

  <g transform="translate(1015,190)">

    <line
      x1="0"
      y1="0"
      x2="0"
      y2="-64"
      stroke="#93C5FD"
      stroke-width="2"
    />

    <circle
      r="22"
      fill="none"
      stroke="#60A5FA"
      stroke-width="1.5"
      filter="url(#glow)"
    >
      <animate
        attributeName="r"
        values="17;24;17"
        dur="1.8s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.5;1;0.5"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

    <circle
      r="9"
      fill="#EFF6FF"
      filter="url(#glow)"
    />

  </g>


  <g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle"
  >

    <rect
      x="885"
      y="24"
      width="260"
      height="70"
      rx="10"
      fill="#0D2452"
      stroke="#93C5FD"
      stroke-opacity="0.65"
    />

    <text
      x="1015"
      y="52"
      font-size="16"
      font-weight="700"
      fill="#FFFFFF"
    >
      2026 · Tarhfam
    </text>

    <text
      x="1015"
      y="81"
      font-size="13"
      fill="#BFDBFE"
    >
      Founder &amp; Lead Web Designer
    </text>

  </g>

</svg>
