<svg width="1160" height="260" viewBox="0 0 1160 260" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Tarhfam Blue Background -->
    <linearGradient id="tarhfamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06142f"/>
      <stop offset="45%" stop-color="#0b2d63"/>
      <stop offset="75%" stop-color="#1456b8"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <filter id="blueGlowFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    width="1160"
    height="260"
    rx="16"
    fill="url(#tarhfamBg)"
  />

  <rect
    width="1160"
    height="260"
    rx="16"
    fill="url(#blueGlow)"
  />

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="1158"
    height="258"
    rx="15"
    fill="none"
    stroke="#60a5fa"
    stroke-opacity="0.32"
    stroke-width="1.5"
  />

  <!-- Rising digital particles -->
  <g fill="#93c5fd">

    <circle cx="230" cy="190" r="2.4" opacity="0">
      <animate
        attributeName="cy"
        values="190;30"
        dur="4.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.8;0"
        dur="4.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="520" cy="190" r="2" opacity="0">
      <animate
        attributeName="cy"
        values="190;20"
        dur="5.2s"
        repeatCount="indefinite"
        begin="1.1s"
      />
      <animate
        attributeName="opacity"
        values="0;0.7;0"
        dur="5.2s"
        repeatCount="indefinite"
        begin="1.1s"
      />
    </circle>

    <circle cx="810" cy="190" r="2.6" opacity="0">
      <animate
        attributeName="cy"
        values="190;25"
        dur="4.8s"
        repeatCount="indefinite"
        begin="2.3s"
      />
      <animate
        attributeName="opacity"
        values="0;0.8;0"
        dur="4.8s"
        repeatCount="indefinite"
        begin="2.3s"
      />
    </circle>

    <circle
      cx="1060"
      cy="190"
      r="2.2"
      opacity="0"
      fill="#dbeafe"
    >
      <animate
        attributeName="cy"
        values="190;15"
        dur="4s"
        repeatCount="indefinite"
        begin="0.6s"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="4s"
        repeatCount="indefinite"
        begin="0.6s"
      />
    </circle>

  </g>


  <!-- Timeline -->
  <path
    id="timelinePath"
    d="M145,190 L1015,190"
    fill="none"
    stroke="#163b78"
    stroke-width="3"
  />

  <path
    d="M145,190 L1015,190"
    fill="none"
    stroke="#60a5fa"
    stroke-width="1.5"
    filter="url(#blueGlowFilter)"
    opacity="0.8"
  />


  <!-- Traveling digital pulse -->

  <circle r="3" fill="#bfdbfe" opacity="0.35">
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      begin="-0.3s"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#93c5fd" opacity="0.65">
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      begin="-0.15s"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>
  </circle>

  <circle
    r="6"
    fill="#ffffff"
    filter="url(#blueGlowFilter)"
  >
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
    >
      <mpath href="#timelinePath"/>
    </animateMotion>
  </circle>


  <!-- ========================================================= -->
  <!-- ==================== NODE 1 ==================== -->

<g transform="translate(145,190)">
  <line
    x1="0"
    y1="0"
    x2="0"
    y2="-64"
    stroke="#1D4ED8"
    stroke-width="2"
  />

  <circle
    r="16"
    fill="none"
    stroke="#60A5FA"
    stroke-width="1.5"
    opacity="0.65"
  />

  <circle
    r="8"
    fill="#2563EB"
  />
</g>

<g
  font-family="Arial, Helvetica, sans-serif"
  text-anchor="middle"
>
  <rect
    x="15"
    y="24"
    width="260"
    height="70"
    rx="10"
    fill="#081A3C"
    stroke="#3B82F6"
    stroke-opacity="0.5"
  />

  <text
    x="145"
    y="52"
    font-size="14px"
    font-weight="700"
    fill="#FFFFFF"
  >
    2023 · Freelance
  </text>

  <text
    x="145"
    y="81"
    font-size="13px"
    fill="#93C5FD"
  >
    Web Designer &amp; WordPress Developer
  </text>
</g>


