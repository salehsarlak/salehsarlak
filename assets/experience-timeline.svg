<!-- ==================== NODE 4 ==================== -->

<g transform="translate(1015,190)">
  <line
    x1="0"
    y1="0"
    x2="0"
    y2="-64"
    stroke="#93C5FD"
    stroke-width="2"
  />

  <circle
    r="22"
    fill="none"
    stroke="#60A5FA"
    stroke-width="1.5"
    filter="url(#glow)"
  >
    <animate
      attributeName="r"
      values="17;24;17"
      dur="1.8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.5;1;0.5"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    r="9"
    fill="#EFF6FF"
    filter="url(#glow)"
  />
</g>

